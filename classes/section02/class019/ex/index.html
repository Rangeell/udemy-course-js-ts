<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exercício | Array - Object - DOM</title>

    <link rel="stylesheet" href="style/index.css">
</head>

<body>
    <header> 
        <h1>Exercício para testar os conhecimentos adquiridos</h1>
    </header>

    <main>
        <form action="" method="get" autocomplete="off" id="form">
            <p>
                <label for="iname">Nome:</label>
                <input type="text" name="name" id="iname" required>
            </p>

            <p>
                <label for="isurname">Sobrenome:</label>
                <input type="text" name="surname" id="isurname" required>
            </p>

            <p>
                <label for="iweight">Peso:</label>
                <input type="number" name="weight" id="iweight" required>
            </p>

            <p>
                <label for="iheight">Altura</label>
                <input type="number" name="height" id="iheight" required>
            </p>

            <p>
                <button type="submit">Enviar</button>
            </p>

            <div id="res">

            </div>
        </form>
    </main>

    <script src="js/index.js"></script>
</body>

</html>
