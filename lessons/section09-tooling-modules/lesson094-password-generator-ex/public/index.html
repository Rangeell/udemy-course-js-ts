<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class 094 | Password Generator</title>

</head>

<body>
    <main>
        <header>
            <h1>Gerador de Senhas</h1>
        </header>

        <section>
            <div class="senha-gerada">Selecione as opções</div>

            <form action="#" method="get">
                <p>
                    <label for="caracter">Quantidade de Caracteres</label>
                    <input type="number" name="caracter" id="caracter" min="1" max="50" value="20">
                </p>
    
                <p>
                    <label for="chk-maiusculas">Adicionar maiúsculas</label>
                    <input type="checkbox" name="check" id="chk-maiusculas">
                </p>
                
                <p>
                    <label for="chk-minusculas">Adicionar minúsculas</label>
                    <input type="checkbox" name="check" id="chk-minusculas">
                </p>
                
                <p>
                    <label for="chk-numeros">Adicionar números</label>
                    <input type="checkbox" name="check" id="chk-numeros">
                </p>
                
                <p>
                    <label for="chk-simbolos">Adicionar símbolos</label>
                    <input type="checkbox" name="check" id="chk-simbolos">
                </p>
    
                <button>Gerar Senha</button>
            </form>
        </section>
    </main>

    <script src="./assets/js/bundle.js"></script>
</body>

</html>
