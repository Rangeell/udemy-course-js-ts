<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <link rel="stylesheet" href="./assets/styles/main.css">
</head>

<body>
    <main>
        <header>
            <h1>Formulário de Cadastro</h1>
        </header>

        <section>
            <ul>
                <li>Nenhum campo pode estar vazio</li>
                <li>Usuário só poderá conter letras e/ou números</li>
                <li><abbr class="tooltip" data-tooltip="Texto">Usuário</abbr> deverá ter entre 3 e 12 caracteres</li>
                <li><abbr class="tooltip" data-tooltip="Senha">Senha</abbr> precisa ter entre 6 e 12 caracteres</li>
            </ul>
        </section>

        <form action="#" method="post">
            <p class="name-area">
                <label for="nome">Nome</label>
                <input type="text" name="name" id="nome" class="validar">
            </p>

            <p class="surname-area">
                <label for="sobrenome">Sobrenome</label>
                <input type="text" name="surname" id="sobrenome" class="validar">
            </p>

            <p class="cpf-area">
                <label for="cpf">CPF</label>
                <input type="text" name="cpf" id="cpf" class="validar cpf">
            </p>

            <p class="username-area">
                <label for="usuario">Usuário</label>
                <input type="text" name="username" id="usuario" class="validar usuario">
            </p>

            <p class="password-area">
                <label for="senha">Senha</label>
                <input type="password" name="password" id="senha" class="validar">
            </p>

            <p class="repeat-password-area">
                <label for="repetir-senha">Repetir senha</label>
                <input type="password" name="repeat-password" id="repetir-senha" class="validar">
            </p>

            <p>
                <button type="submit">Enviar</button>
            </p>

        </form>

    </main>
    
    <script src="assets/js/validate-cpf.js"></script> <!--* Arquivo que contém o objeto que valida o cpf -->
    <script src="./assets/js/main.js"></script>
</body>

</html>
